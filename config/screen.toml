# ============================================================
# myfin 选股流水线参数
# 策略规格见 docs/strategy.md；本文件只放可调参数。
# 回测敏感性表见 data/reports/backtest-*.md（M4 生成）。
# ============================================================

[as_of]
# 财务优先使用真实 pubDate；缺失时按近似天数推算并由严格门禁阻断
# Q1 4-30 / H1 8-31 / Q3 10-31 / 年报 4-30 → 取 ~60 天
ann_date_approx_days = 60
# 严格点时流程拒绝只有推算公告日的财务记录；研究调试可显式改为 false。
require_real_ann_date = true

[universe]
require_point_in_time = true
# 免费数据源不支持北交所（mootdx/baostock/腾讯公网均缺 BJ 数据）
exclude_bse = true
exclude_st = true
# 上市不足 1 年：无历史分位可算
min_list_years = 1
# 市值下限 50 亿（退市新规「市值退」阈值 5 亿，留 10 倍缓冲；
# 个人资金量下 >50 亿同时规避小盘流动性风险）
min_market_cap = 5.0e9
# 日均成交额下限（剔除流动性不足，防滑点过大）
min_avg_amount = 5.0e7

[environment]
# 行业相对收益使用近 6 个月（126 个交易日）窗口，仅作环境归因
return_window_days = 126
# 最近 4 个报告期与此前 4 个报告期比较，近似 TTM 同比
profit_trend_quarters = 4
# 行业成员不足时不生成环境标签，避免小样本误导
min_members = 3
# 行业内至少一半公司的 TTM 净利润改善时标记盈利拐点
earnings_turning_min_share = 0.5

[undervalued]
# 分位窗口固定 5 年（约 1250 交易日）；输出时附「上市以来」分位对照
percentile_window_days = 1250
# PE/PB 5 年分位 < 30% 入选（回测时做 20/30/40 敏感性网格）
percentile_max = 0.30
# 行业内分位（行业中性化，避免整池集中于单一风格）
use_industry_percentile = true

[exclusion]
# 连续亏损（TTM 净利为负）最多允许季数
max_consecutive_loss_quarters = 2
# 经营现金流为负的最大季数
max_neg_cashflow_quarters = 3
# 核心质量规则缺少经营现金流时拒绝进入筛选，而不是把缺失当作无风险。
require_oper_cash_flow = true
# 资产负债率上限
max_debt_ratio = 0.70
# 净资产 < 0 直接出池（资不抵债）
exclude_negative_equity = true
# 行业化硬排除阈值；未列行业使用上面的通用阈值。
[exclusion.industry_debt_ratio]
"银行" = 0.95
"房地产" = 0.85
"建筑装饰" = 0.85
"公用事业" = 0.85

[recovery]
# 主信号：业绩预告/快报净利同比由负转正（免费可得，披露远早于财报）
require_earnings_turnaround = true
# 分位回升：当前分位 < 0.30 且 3 个月前分位 < 0.20（确实曾更深低估）
percent_3m_ago_max = 0.20
# 3 个月动量 > 0
momentum_days = 63
# 收盘价站上 120 日均线
ma_days = 120
# 量能回升：近 20 日均成交额 / 前 60 日均成交额 >= 1.2
volume_ratio_min = 1.2
# 业绩主信号之外至少满足两个价格/分位/量能辅信号。
min_secondary_signals = 2

[portfolio]
# 固定月末信号，下一交易日成交；不调整市场总仓位，仅允许无候选时持有现金。
signal_at_month_end = true
execution_lag_trading_days = 1
max_positions = 20
max_industry_weight = 0.25
transaction_cost_bps = 5.0
slippage_bps = 5.0
min_entry_amount = 0.0
allow_cash = true
# v1 回测固定持有期；逻辑破坏退出留给单独的持仓监控流程。
exit_on_signal_loss = false
require_trade_status = true
