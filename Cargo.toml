[workspace]
resolver = "2"
members = ["crates/mf-core", "crates/mf-datasource", "crates/mf-storage", "crates/mf-screener", "crates/mf-report", "crates/mfctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

# mf-core
mf-core = { path = "crates/mf-core" }
mf-datasource = { path = "crates/mf-datasource" }
mf-storage = { path = "crates/mf-storage" }
mf-screener = { path = "crates/mf-screener" }
mf-report = { path = "crates/mf-report" }
mfctl = { path = "crates/mfctl" }

[profile.release]
lto = "thin"
