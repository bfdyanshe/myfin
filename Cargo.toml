[workspace]
resolver = "2"
members = ["crates/mf-core", "crates/mf-datasource", "crates/mf-storage", "crates/mf-screener", "crates/mf-backtest", "crates/mf-report", "crates/mfctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
duckdb = { version = "1.10505.0", features = ["bundled", "parquet", "chrono"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# mf-core
mf-core = { path = "crates/mf-core" }
mf-datasource = { path = "crates/mf-datasource" }
mf-storage = { path = "crates/mf-storage" }
mf-screener = { path = "crates/mf-screener" }
mf-backtest = { path = "crates/mf-backtest" }
mf-report = { path = "crates/mf-report" }
mfctl = { path = "crates/mfctl" }

[profile.release]
lto = "thin"
