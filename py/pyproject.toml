[project]
name = "myfin-py"
version = "0.1.0"
description = "Python data-source adapters for the myfin quant platform (Baostock / AKShare / mootdx)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "baostock",
    "akshare",
    "mootdx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/myfin_py"]
